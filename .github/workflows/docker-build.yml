name: Docker Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Debug: List files
      run: |
        echo "Repository root:"
        ls -la
        echo "Backend directory:"
        ls -la lelepanel-backend/
        echo "Database file info:"
        ls -l lelepanel-backend/database.db
        file lelepanel-backend/database.db
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./lelepanel-backend/Dockerfile
        load: true
        tags: lelepanel:latest
        
    - name: Save Docker image
      run: |
        docker save lelepanel:latest -o lelepanel.tar
        
    - name: Upload Docker image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: lelepanel.tar
